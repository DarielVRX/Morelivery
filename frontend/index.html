<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#a85c5c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#c97f7f" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__UI_BRAND__" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <link rel="apple-touch-startup-image" href="/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />

    <title>__UI_BRAND__</title>

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
          if (!stored) localStorage.setItem('theme', isDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        } catch(e) {}
      })();
    </script>

    <style>
      :root { --splash-bg: #ffffff; --brand-main: #a85c5c; --brand-light: #c97f7f; --text-name: #c97f7f; }
      [data-theme="dark"] { --splash-bg: #0f0f0f; --text-name: #e3aaaa; }

      body { margin: 0; background: var(--splash-bg); overflow: hidden; }

      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: var(--splash-bg);
        transition: opacity 0.35s ease;
      }

      #splash-logo {
        width: 72px; height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--brand-main) 0%, var(--brand-light) 100%);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 32px rgba(169, 92, 92, 0.35);
        animation: splash-pulse 1.6s ease-in-out infinite;
      }

      #splash-name {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
        color: var(--text-name);
      }

      #splash-sub {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px; font-weight: 500; letter-spacing: 0.05em;
        color: #9ca3af; text-transform: uppercase;
      }

      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }

      #splash.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 14H24L28 22H8V14Z" fill="white" fill-opacity="0.9" />
          <circle cx="13" cy="26" r="3" fill="white" fill-opacity="0.9" />
          <circle cx="25" cy="26" r="3" fill="white" fill-opacity="0.9" />
          <path d="M28 18L32 14L36 18" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
        </svg>
      </div>
      <div id="splash-name">__UI_BRAND__</div>
      <div id="splash-sub">Cargando…</div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function() {
        var splash = document.getElementById('splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;

        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            splash.classList.add('hidden');
            setTimeout(function() { splash.remove(); }, 400);
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });

        // Fallback de 3 segundos
        setTimeout(function() {
          if (splash.parentNode) {
            splash.classList.add('hidden');
            setTimeout(function() { try { splash.remove(); } catch(e) {} }, 400);
          }
        }, 3000);
      })();
    </script>
  </body>
</html>
